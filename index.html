        document.getElementById('screen-app').classList.remove('hidden');

        document.getElementById('screen-app').classList.add('hidden');

        const badge = document.getElementById('user-role-badge');

        else if (currentUser.role === 'director') badge.textContent = 'Diretoria / Pastor';

    // --- TAB NAVIGATION ---
    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.getAttribute('data-tab') === tab) {
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-amber-500');
            } else {
                btn.classList.remove('text-amber-500');
                btn.classList.add('text-gray-400');
            }
        });

        renderTabContent();
        lucide.createIcons();
    }

    function renderTabContent() {
        const container = document.getElementById('main-content');
        if (activeTab === 'home') container.innerHTML = renderHomeTab();
        else if (activeTab === 'matricula') container.innerHTML = renderMatriculaTab();
        else if (activeTab === 'tatame') container.innerHTML = renderTatameTab();
        else if (activeTab === 'game') container.innerHTML = renderGameTab();
        else if (activeTab === 'fe') container.innerHTML = renderFeTab();
        else if (activeTab === 'secretaria') container.innerHTML = renderSecretariaTab();

    // Signature Canvas Logic
    let canvas, ctx, drawing = false;
    function initSignature() {
        canvas = document.getElementById('signature-pad');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('touchstart', startDrawTouch, {passive: false});
        canvas.addEventListener('touchmove', drawTouch, {passive: false});
        canvas.addEventListener('touchend', stopDraw);
    }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX || e.touches[0].clientX) - rect.left,
            y: (e.clientY || e.touches[0].clientY) - rect.top
        };
    }

    function startDraw(e) { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
    function draw(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function startDrawTouch(e) { e.preventDefault(); startDraw(e); }
    function drawTouch(e) { e.preventDefault(); draw(e); }
    function stopDraw() { drawing = false; }
    function clearSignature() { if(ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); }
